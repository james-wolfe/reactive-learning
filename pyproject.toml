[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactive-learning"
version = "0.1.0"
license = "MIT"
description = "Simulations, figures and numerical checks for 'Multi-Agent Learning of Reactive IPD Strategies'"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.14",
    # Executing the figure and check notebooks (make notebooks / make checks).
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reactive_learning"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", "notebooks"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
